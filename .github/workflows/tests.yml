name: Tests and Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (CPU Mode for GitHub Actions)
      run: |
        python -m pip install --upgrade pip
        # 1. Install pre-compiled CuPy so the build doesn't crash
        pip install cupy-cuda12x
        # 2. Force CPU-only JAX for the cloud runner
        pip install -U "jax[cpu]"
        pip install -e .[dev]
        pip install jax jaxlib vbjax
        pip install vbi[all]

    - name: Run JAX core tests
      run: |
        # Run test_jax_mpr logic to ensure internal engine works
        python test_jax_mpr.py

    - name: Run numerical benchmark validation
      run: |
        # The benchmark script now explicitly yields exit status 1 if divergence is caught outside tolerances
        python benchmark_numba_jax.py
